<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gestión</title>

    <!-- App instalable (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestión" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
      /* Los botones usan estilos en línea sin estado deshabilitado: se marca aquí para todos */
      button:disabled { opacity: .5; cursor: not-allowed; }

      /* Ajustes para celular. Las páginas usan estilos en línea, por eso se
         seleccionan por su atributo style y se usa !important. */
      @media (max-width: 768px) {
        /* iOS hace zoom al enfocar campos con letra menor a 16px */
        input, select, textarea { font-size: 16px !important; }

        /* Formularios de 2 y 3 columnas → una sola columna */
        [style*="grid-template-columns: 1fr 1fr;"],
        [style*="grid-template-columns: 1fr 1fr 1fr;"],
        [style*="grid-template-columns: repeat(3, 1fr);"] { grid-template-columns: 1fr !important; }
        /* Un campo que abarcaba 2 columnas crearía una columna fantasma al quedar en una sola */
        [style*="grid-template-columns: 1fr 1fr;"] > *,
        [style*="grid-template-columns: 1fr 1fr 1fr;"] > *,
        [style*="grid-template-columns: repeat(3, 1fr);"] > * { grid-column: auto !important; }
        [style*="grid-template-columns: 1fr 1fr 1fr 1fr;"],
        [style*="grid-template-columns: repeat(4, minmax(0px, 1fr));"],
        [style*="grid-template-columns: repeat(3, minmax(0px, 1fr));"] { grid-template-columns: 1fr 1fr !important; }

        /* Tablas anchas: desplazamiento horizontal en lugar de desbordar la pantalla */
        main table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* Modales: ocupan el ancho disponible y se desplazan si son altos */
        div[style*="position: fixed"] > div { max-width: 100% !important; max-height: 100%; overflow-y: auto; }

        /* Modales con fondo oscuro → pantalla completa. Los que ya son de pantalla
           completa (ModalFormulario, captura de resultados) tienen fondo sólido y no entran. */
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] {
          padding: 0 !important; align-items: stretch !important; justify-content: stretch !important;
        }
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] > :is(div, form) {
          width: 100% !important; max-width: 100% !important; height: 100% !important; max-height: 100% !important;
          border-radius: 0 !important; box-shadow: none !important;
          display: flex; flex-direction: column; overflow-y: auto !important;
          padding-top: calc(12px + env(safe-area-inset-top)) !important;
          padding-bottom: env(safe-area-inset-bottom) !important;
        }
        /* Cuerpos con su propio scroll (alto calculado para el modal de escritorio) llenan la pantalla */
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] > :is(div, form) > div[style*="max-height: calc"] {
          max-height: none !important; flex: 1 0 auto;
        }
        /* Campos con altura mínima para tocarlos con el dedo */
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] :is(input:not([type="checkbox"]):not([type="radio"]), select) {
          min-height: 40px;
        }
        /* Formularios en línea de una fila que terminan en botón (registrar pago, agregar
           movimiento a la póliza…) → dos columnas */
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] [style*="grid-template-columns"][style*="fr auto;"] {
          grid-template-columns: 1fr 1fr !important;
        }
        /* Fila de botones al final del formulario: fija abajo y con botones más fáciles de tocar */
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] div[style*="justify-content: flex-end"]:last-child:has(> button) {
          position: sticky; bottom: 0; z-index: 2; background: #fff;
          margin-top: 16px !important; padding: 10px 0 !important; border-top: 1px solid #e2e8f0;
        }
        div[style*="position: fixed"][style*="inset: 0px"][style*="background: rgba"] div[style*="justify-content: flex-end"]:last-child:has(> button) > button {
          flex: 1; min-height: 44px; font-size: 15px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
