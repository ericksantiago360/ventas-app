upstream backend    { server backend:8000; }
upstream frontend   { server frontend:80;  }
upstream storefront { server storefront:80; }

# Tienda pública: límite por IP para frenar abuso del checkout y del catálogo
limit_req_zone $binary_remote_addr zone=tienda:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # API pública de la tienda (sin JWT), con límite de tasa
    location /api/tienda/ {
        limit_req        zone=tienda burst=40 nodelay;
        proxy_pass       http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # API y auth → FastAPI
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
    }

    # PDFs, logos y demás archivos generados
    location /storage/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
    }

    # Sitemap de una tienda: lo genera el backend (el resto de /tienda/ es el storefront)
    location ~ ^/tienda/([^/]+)/sitemap\.xml$ {
        rewrite ^/tienda/([^/]+)/sitemap\.xml$ /api/tienda/$1/sitemap.xml break;
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tienda en línea (storefront React) → contenedor storefront
    location /tienda/ {
        proxy_pass       http://storefront;
        proxy_set_header Host $host;
    }

    # React SPA → frontend container
    location / {
        proxy_pass       http://frontend;
        proxy_set_header Host $host;
    }
}
